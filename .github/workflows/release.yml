name: fffactory release

# Publishes a GitHub Release when a version tag is pushed. The tag must be `v` followed by
# package.json's version (v0.1.0 for 0.1.0); any other tag is refused before anything is
# built. The executables workflow builds both targets from one asset bundle, smoke-tests
# linux-x64 in a clean container and darwin-arm64 on Apple Silicon, and ad-hoc signs
# darwin-arm64; only when all of that passes does the publish job assemble fffactory-darwin-arm64,
# fffactory-linux-x64, SHA256SUMS and install.sh and create the release.
# Spec: docs/specs/release.md §Distribution.
on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: fffactory-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    name: Check the tag against package.json
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Require a release commit on main
        env:
          TAG: ${{ github.ref_name }}
        run: ./scripts/assemble-release.sh check-source "$TAG"

      - name: Check the tag
        id: check
        env:
          TAG: ${{ github.ref_name }}
        run: ./scripts/assemble-release.sh check-tag "$TAG" >>"$GITHUB_OUTPUT"

  executables:
    name: Build, smoke-test and sign
    needs: tag
    permissions:
      contents: read
    uses: ./.github/workflows/executables.yml

  publish:
    name: Publish the GitHub Release
    needs:
      - tag
      - executables
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # By exact name: fffactory-darwin-arm64-unsigned holds a file of the same name.
      - name: Download linux-x64 executable
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fffactory-linux-x64
          path: artifacts

      - name: Download signed darwin-arm64 executable
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fffactory-darwin-arm64
          path: artifacts

      # Restores the execute bits artifacts lose and digests the signed files as published.
      - name: Assemble release assets
        env:
          TAG: ${{ github.ref_name }}
        run: ./scripts/assemble-release.sh assemble "$TAG" artifacts release

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.tag.outputs.version }}
          PRERELEASE: ${{ needs.tag.outputs.prerelease }}
        run: |
          cat >notes.md <<EOF
          Install or upgrade fffactory ${VERSION} (darwin-arm64 or linux-x64):

          \`\`\`sh
          curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/install.sh | FFFACTORY_VERSION=${VERSION} sh
          \`\`\`

          install.sh verifies the executable against SHA256SUMS.
          EOF
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "fffactory $VERSION" --notes-file notes.md --prerelease="$PRERELEASE" \
            release/SHA256SUMS release/fffactory-darwin-arm64 release/fffactory-linux-x64 \
            release/install.sh
