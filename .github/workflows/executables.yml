name: fffactory executables

# Builds both release targets from one asset bundle, smoke-tests linux-x64 in a clean
# container, and ad-hoc signs and runs darwin-arm64 on Apple Silicon. It uploads
# fffactory-linux-x64, fffactory-darwin-arm64-unsigned, the signed fffactory-darwin-arm64 and
# fffactory-assets; the release workflow calls this one and publishes the two executables.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

concurrency:
  group: fffactory-executables-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build both targets and smoke-test linux-x64
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build darwin-arm64 and linux-x64
        run: bun scripts/build.ts darwin-arm64 linux-x64

      # No Bun, Node or checkout in the container, no network, and no AWS credentials.
      - name: Smoke-test linux-x64 in a clean container
        run: ./scripts/smoke-test.sh dist/fffactory-linux-x64

      - name: Upload linux-x64 executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fffactory-linux-x64
          path: dist/fffactory-linux-x64
          if-no-files-found: error

      - name: Upload unsigned darwin-arm64 executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fffactory-darwin-arm64-unsigned
          path: dist/fffactory-darwin-arm64
          if-no-files-found: error

      - name: Upload asset bundle and digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fffactory-assets
          path: |
            dist/fffactory-assets.tar.gz
            dist/fffactory-assets.tar.gz.sha256
          if-no-files-found: error

  macos:
    name: Ad-hoc sign and run darwin-arm64
    needs: build
    runs-on: macos-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download unsigned darwin-arm64 executable
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fffactory-darwin-arm64-unsigned
          path: dist

      - name: Download asset bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fffactory-assets
          path: dist

      - name: Ad-hoc sign with Bun's entitlements
        run: |
          chmod +x dist/fffactory-darwin-arm64
          ./scripts/sign-macos.sh dist/fffactory-darwin-arm64

      - name: Run on Apple Silicon
        run: |
          test "$(uname -m)" = arm64
          file dist/fffactory-darwin-arm64
          dist/fffactory-darwin-arm64 --version

      - name: Smoke-test outside a checkout
        run: ./scripts/smoke-test.sh --no-container dist/fffactory-darwin-arm64

      - name: Upload signed darwin-arm64 executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fffactory-darwin-arm64
          path: dist/fffactory-darwin-arm64
          if-no-files-found: error
