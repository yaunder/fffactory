name: Factory code validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # The job keeps its display name: it is the check branch protection requires
  # (.github/main-branch-protection.json).
  repository-checks:
    name: Factory code validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Validate repository skills
        run: ./scripts/repository-skills.sh

      # The shell and Python tests of the programs shipped in assets/steps/, which bun test
      # does not run.
      - name: Run shell tests
        run: |
          ./assets/steps/repositories/tests/sync-repositories.sh
          python3 assets/steps/dispatch/tests/test_factory_dispatch.py
          python3 assets/steps/dispatch/tests/test_dispatch_schedule.py
          python3 assets/steps/control-plane/tests/test_paseo_auth.py
          python3 assets/steps/control-plane/tests/test_paseo_config.py
